# Use case configuration for Xiaomi redwood
#
# Playback: two AW88261 speaker amps on Primary MI2S (MultiMedia1).
# Capture: WCD938x analog mics over SoundWire -> LPASS TX macro ->
# TX_CODEC_DMA_TX_3 (MultiMedia2, hw:N,1). Mic mapping from the vendor
# mixer_paths: AMIC1 = handset-mic (ADC1), AMIC5 = speaker-mic (ADC4 INP5),
# AMIC2 = headset mic (ADC2 INP2). AMIC3 (ADC2 INP3) is not populated.

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "Speaker Playback"

	EnableSequence [
		cset "name='Speaker Top Profile Set' Music"
		cset "name='Speaker Top Playback Switch' on"
		cset "name='Speaker Bottom Playback Switch' on"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic1" {
	Comment "Main Microphone"

	ConflictingDevice [
		"Mic2"
		"Mic5"
	]

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"

		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 6"
		cset "name='TX0 MODE' ADC_NORMAL"
	]

	DisableSequence [
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='TX0 MODE' ADC_INVALID"

		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
	]

	Value {
		CaptureChannels 1
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "ADC1"
		CaptureVolume "ADC1 Volume"
	}
}

SectionDevice."Mic5" {
	Comment "Secondary Microphone"

	ConflictingDevice [
		"Mic1"
		"Mic2"
	]

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC5"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"

		cset "name='ADC4_MIXER Switch' 1"
		cset "name='HDR34 MUX' NO_HDR34"
		cset "name='ADC4 MUX' INP5"
		cset "name='ADC4 Switch' 1"
		cset "name='ADC4 Volume' 6"
		cset "name='TX3 MODE' ADC_NORMAL"
	]

	DisableSequence [
		cset "name='ADC4 Switch' 0"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='TX3 MODE' ADC_INVALID"

		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
	]

	Value {
		CaptureChannels 1
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "ADC4"
		CaptureVolume "ADC4 Volume"
	}
}

SectionDevice."Mic2" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Mic1"
		"Mic5"
	]

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"

		cset "name='ADC2_MIXER Switch' 1"
		cset "name='HDR12 MUX' NO_HDR12"
		cset "name='ADC2 MUX' INP2"
		cset "name='ADC2 Switch' 1"
		cset "name='ADC2 Volume' 6"
		cset "name='TX1 MODE' ADC_NORMAL"
	]

	DisableSequence [
		cset "name='ADC2 Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='TX1 MODE' ADC_INVALID"

		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
	]

	Value {
		CaptureChannels 1
		CapturePriority 300
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "ADC2"
		CaptureVolume "ADC2 Volume"
		JackControl "Mic Jack"
	}
}
