# Use case configuration for Xiaomi redwood (speakers only for now:
# microphones/headset need the WCD codec, not enabled yet)

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "Speaker Playback"

	EnableSequence [
		cset "name='Speaker Top Profile Set' Music"
		cset "name='Speaker Top Playback Switch' on"
		cset "name='Speaker Bottom Playback Switch' on"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}
