# Voice calls for Xiaomi redwood
#
# Modem audio runs inside the ADSP (q6mvm/q6cvs/q6cvp). VoiceMMode1 (hw:N,3)
# is a hostless front end: dummystreamhack keeps it open while a device is
# enabled, which starts the DSP voice session. Downlink goes to Primary MI2S
# (AW88261 amps; the top amp in "Receiver" profile is the earpiece) or to
# (not yet) the headphones: q6routing has no RX_CODEC_DMA_RX_0 voice
# mixer. Uplink comes from TX_CODEC_DMA_TX_3.
# Based on Motorola/dubai and Fairphone/fp5 VoiceCall.conf.

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='VoiceMMode1 Capture Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='VoiceMMode1 Capture Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value.TQ "Voice"
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='Speaker Bottom Playback Switch' off"
		cset "name='Speaker Top Profile Set' Receiver"
		cset "name='Speaker Top Playback Switch' on"
		exec "systemctl --user start dummystreamhack@Rhw:${CardId},3"
	]

	DisableSequence [
		exec "systemctl --user stop dummystreamhack@Rhw:${CardId},3"
		cset "name='Speaker Top Profile Set' Music"
		cset "name='Speaker Bottom Playback Switch' on"
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Speaker" {
	Comment "Speakerphone"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='Speaker Top Profile Set' Music"
		cset "name='Speaker Top Playback Switch' on"
		cset "name='Speaker Bottom Playback Switch' on"
		exec "systemctl --user start dummystreamhack@Rhw:${CardId},3"
	]

	DisableSequence [
		exec "systemctl --user stop dummystreamhack@Rhw:${CardId},3"
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}


SectionDevice."Mic1" {
	Comment "Main Microphone"

	ConflictingDevice [
		"Mic2"
	]

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		# The TX path delivers ~48 dB too little (24/32-bit alignment on the
		# codec DMA port, under investigation): max analog, +20 dB digital
		cset "name='TX_DEC0 Volume' 104"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 20"
		cset "name='TX0 MODE' ADC_NORMAL"
		exec "systemctl --user start dummystreamhack@Thw:${CardId},3"
	]

	DisableSequence [
		exec "systemctl --user stop dummystreamhack@Thw:${CardId},3"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='TX0 MODE' ADC_INVALID"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
	]

	Value {
		CaptureChannels 1
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "ADC1"
	}
}

SectionDevice."Mic2" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Mic1"
	]

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='HDR12 MUX' NO_HDR12"
		cset "name='ADC2 MUX' INP2"
		cset "name='ADC2 Switch' 1"
		cset "name='ADC2 Volume' 6"
		cset "name='TX1 MODE' ADC_NORMAL"
		exec "systemctl --user start dummystreamhack@Thw:${CardId},3"
	]

	DisableSequence [
		exec "systemctl --user stop dummystreamhack@Thw:${CardId},3"
		cset "name='ADC2 Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='TX1 MODE' ADC_INVALID"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
	]

	Value {
		CaptureChannels 1
		CapturePriority 300
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "ADC2"
		JackControl "Mic Jack"
	}
}
